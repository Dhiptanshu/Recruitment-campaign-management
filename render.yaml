services:
  - type: web
    name: globalvox-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: globalvox-db
          property: connectionString
      - key: ALLOWED_ORIGINS
        sync: false # set manually in the Render dashboard once you have the Vercel URL

databases:
  - name: globalvox-db
    plan: free
    databaseName: globalvox
    user: globalvox
