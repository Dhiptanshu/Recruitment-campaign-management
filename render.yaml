services:
  - type: web
    name: globalvox-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        fromDatabase:
          name: globalvox-db
          property: connectionString
      - key: ALLOWED_ORIGINS
        sync: false # set manually in the Render dashboard once you have the Vercel URL
      - key: LLM_API_KEY
        sync: false # optional: your aicredits.in API key -- unset means the deterministic fallback scorer is always used
      - key: LLM_MODEL
        sync: false # optional: model name available on your aicredits.in account (defaults to "gpt-4o-mini" if unset)

databases:
  - name: globalvox-db
    plan: free
    databaseName: globalvox
    user: globalvox
